<div class="video-box home" (contextmenu)="disableRightClick($event)">
  <video muted autoplay [playsInline]="true" loop #videoPlayer oncanplay="this.play()" onloadedmetadata="this.muted = true" preload="auto"
  disablePictureInPicture
  controlsList="nodownload noplaybackrate nofullscreen">
    <source src="../../assets/wedd.mp4" type="video/mp4" />
  </video>
  <app-navbar (navigateTo)="onNavbarNavigate($event)"></app-navbar>
</div>
